name: Steam Workshop Upload

permissions:
  contents: read

env:
  SE_DS_APPID: "298740"

on:
  workflow_call:
    inputs:
      mod_dir:
        required: true
        type: string
      src_dir:
        required: true
        type: string
      workshop_dir:
        required: true
        type: string
      sbmi_profile:
        required: true
        type: string
    secrets:
      STEAM_USERNAME:
        required: true
      STEAM_CONFIG_VDF:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Probe Dedicated Server build id
        id: dsbuild
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lib32gcc-s1 ca-certificates curl
          mkdir -p "$RUNNER_TEMP/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/steamcmd"

          buildid=""
          for attempt in 1 2 3 4 5; do
            out="$("$RUNNER_TEMP/steamcmd/steamcmd.sh" +login anonymous +app_info_update 1 \
                     +app_info_print "$SE_DS_APPID" +quit 2>/dev/null || true)"
            buildid="$(printf '%s' "$out" | tr -d '\r' | awk '
              /"branches"/              { in_branches = 1 }
              in_branches && /"public"/ { in_public = 1 }
              in_public && /"buildid"/  { gsub(/[^0-9]/, "", $2); print $2; exit }
            ')"
            [ -n "$buildid" ] && break
            echo "Dedicated Server build id probe attempt $attempt empty; retrying..."
            sleep 5
          done

          if [ -z "$buildid" ]; then
            echo "WARNING: could not determine DS build id; DS cache will miss this run." >&2
            buildid="norev-${{ github.run_id }}"
          fi
          echo "Dedicated Server public build id: $buildid"
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"

      - name: Cache Dedicated Server reference assemblies
        id: dscache
        uses: actions/cache@v5
        with:
          path: ds64
          key: ds64-linux-${{ steps.dsbuild.outputs.buildid }}

      - name: Install Space Engineers reference assemblies
        if: steps.dscache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SE_DS_DIR="$RUNNER_TEMP/space-engineers-dedicated"
          mkdir -p "$SE_DS_DIR"

          # A fresh SteamCMD self-update can abort the same app_update session
          # with "Missing configuration". Bootstrap first, then retry.
          "$RUNNER_TEMP/steamcmd/steamcmd.sh" +quit || true

          ok=0
          for attempt in 1 2 3 4 5; do
            echo "SteamCMD install attempt $attempt/5"
            "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
              +@sSteamCmdForcePlatformType windows \
              +force_install_dir "$SE_DS_DIR" \
              +login anonymous \
              +app_update "$SE_DS_APPID" validate \
              +quit || true
            if [ -f "$SE_DS_DIR/DedicatedServer64/SpaceEngineersDedicated.exe" ]; then
              ok=1
              break
            fi
            echo "SteamCMD attempt $attempt did not complete the DS install; retrying..."
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "ERROR: SteamCMD failed to install Space Engineers Dedicated Server references." >&2
            exit 1
          fi

          mkdir -p ds64
          cp -a "$SE_DS_DIR/DedicatedServer64/." ds64/

      - name: Validate Dedicated Server reference assemblies
        run: |
          test -f ds64/SpaceEngineersDedicated.exe
          test -f ds64/Sandbox.Game.dll

      - name: Configure MDK references
        run: |
          printf '[mdk]\nbinarypath = %s\n' "$GITHUB_WORKSPACE/ds64" > ShipCoreFramework/ShipCoreFramework.mdk.local.ini

      - name: Build solution with MDK analyzers
        run: dotnet build arcane-systems.sln --configuration Release

  upload:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          [ -n "${{ secrets.STEAM_USERNAME }}" ] || { echo "Missing secret: STEAM_USERNAME"; exit 1; }
          [ -n "${STEAM_CONFIG_VDF:-}" ] || { echo "Missing secret: STEAM_CONFIG_VDF"; exit 1; }
          echo "::add-mask::$STEAM_CONFIG_VDF"
          echo "Using cached SteamCMD host config authentication for workshop upload."

      - name: Build upload content and metadata
        env:
          SBMI_PROFILE: ${{ inputs.sbmi_profile }}
        run: |
          set -euo pipefail
          STAGING="${RUNNER_TEMP}/${{ inputs.mod_dir }}-upload"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          rsync -a --delete "${{ inputs.src_dir }}/" "$STAGING/"

          PROFILE_FILE="${{ inputs.src_dir }}/modinfo.sbmi.${SBMI_PROFILE}"
          if [ ! -f "$PROFILE_FILE" ]; then
            echo "Expected metadata profile not found: $PROFILE_FILE"
            exit 1
          fi

          TITLE_FILE="${{ inputs.workshop_dir }}/title.txt"
          VERSION_FILE="${{ inputs.workshop_dir }}/version.txt"
          DESCRIPTION_FILE="${{ inputs.workshop_dir }}/description.bbcode"
          for FILE in "$TITLE_FILE" "$VERSION_FILE" "$DESCRIPTION_FILE"; do
            if [ ! -f "$FILE" ]; then
              echo "Expected Workshop metadata file not found: $FILE"
              exit 1
            fi
          done

          cp "$PROFILE_FILE" "$STAGING/modinfo.sbmi"

          THUMBNAIL_FILE="$STAGING/thumb.png"
          if [ ! -f "$THUMBNAIL_FILE" ]; then
            echo "Expected Workshop thumbnail not found: $THUMBNAIL_FILE"
            exit 1
          fi

          WORKSHOP_ID="$(PROFILE_FILE="$PROFILE_FILE" python3 -c 'import xml.etree.ElementTree as ET, os; root = ET.parse(os.environ["PROFILE_FILE"]).getroot(); ids = root.findall(".//WorkshopIds/WorkshopId/Id"); print(((ids[0].text or "").strip()) if ids else "")')"

          if [ -z "$WORKSHOP_ID" ] || [ "$WORKSHOP_ID" = "0" ]; then
            echo "Unable to resolve a valid Workshop ID from $PROFILE_FILE"
            exit 1
          fi

          echo "WORKSHOP_ID=$WORKSHOP_ID" >> "$GITHUB_ENV"
          echo "WORKSHOP_PROFILE=$SBMI_PROFILE" >> "$GITHUB_ENV"
          echo "STAGING_DIR=$STAGING" >> "$GITHUB_ENV"
          echo "PREVIEW_FILE=$THUMBNAIL_FILE" >> "$GITHUB_ENV"
          echo "WORKSHOP_TITLE_FILE=$TITLE_FILE" >> "$GITHUB_ENV"
          echo "WORKSHOP_VERSION_FILE=$VERSION_FILE" >> "$GITHUB_ENV"
          echo "WORKSHOP_DESCRIPTION_FILE=$DESCRIPTION_FILE" >> "$GITHUB_ENV"

      - name: Setup SteamCMD
        uses: andriivitiv/setup-steamcmd@v1.2.0

      - name: Prune SBMI profile files from upload staging
        run: |
          set -euo pipefail
          rm -f "$STAGING_DIR/modinfo.sbmi.beta" "$STAGING_DIR/modinfo.sbmi.main"

      - name: Create SteamCMD upload script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          def read_single_line(path, label):
              value = Path(path).read_text(encoding="utf-8").strip()
              if not value or "\n" in value or "\r" in value:
                  raise SystemExit("%s must contain exactly one non-empty line" % label)
              return value

          def normalize_description(value):
              return value.replace("\r\n", "\n").replace("\r", "\n").rstrip("\n")

          def escape_vdf(value):
              return value.replace("\\", "\\\\").replace('"', '\\"')

          base_title = read_single_line(os.environ["WORKSHOP_TITLE_FILE"], "Workshop title")
          version = read_single_line(os.environ["WORKSHOP_VERSION_FILE"], "Workshop version")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Workshop version must use semantic version format: " + version)

          title = "%s (%s)" % (base_title, version)
          if os.environ["WORKSHOP_PROFILE"] == "beta":
              title = "[BETA] " + title

          description = normalize_description(
              Path(os.environ["WORKSHOP_DESCRIPTION_FILE"]).read_text(encoding="utf-8")
          )
          title_bytes = len(title.encode("utf-8"))
          description_bytes = len(description.encode("utf-8"))
          if title_bytes > 128:
              raise SystemExit("Workshop title exceeds Steam's 128-byte limit: %d" % title_bytes)
          if description_bytes >= 8000:
              raise SystemExit("Workshop description must be smaller than Steam's 8000-byte limit: %d" % description_bytes)

          values = (
              ("appid", "244850"),
              ("publishedfileid", os.environ["WORKSHOP_ID"]),
              ("contentfolder", os.environ["STAGING_DIR"]),
              ("previewfile", os.environ["PREVIEW_FILE"]),
              ("title", title),
              ("description", description),
              ("changenote", "GitHub Actions build %s (%s)" % (
                  os.environ["GITHUB_RUN_NUMBER"], os.environ["GITHUB_SHA"]
              )),
          )
          lines = ['"workshopitem"', "{"]
          lines.extend('  "%s" "%s"' % (key, escape_vdf(value)) for key, value in values)
          lines.append("}")
          Path(os.environ["RUNNER_TEMP"], "workshop_item.vdf").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write("WORKSHOP_TITLE=%s\n" % title)

          print("Publishing %s profile to Workshop item %s" % (
              os.environ["WORKSHOP_PROFILE"], os.environ["WORKSHOP_ID"]
          ))
          print("Title: %s (%d bytes)" % (title, title_bytes))
          print("Description: %d bytes" % description_bytes)
          PY

      - name: Install SteamCMD cached credentials config
        env:
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          set -euo pipefail
          echo "::add-mask::$STEAM_CONFIG_VDF"

          mkdir -p "$HOME/Steam/config"
          printf '%s' "$STEAM_CONFIG_VDF" > "$HOME/Steam/config/config.vdf"
          chmod 600 "$HOME/Steam/config/config.vdf"
          echo "Wrote Steam cached credentials config to: $HOME/Steam/config/config.vdf"

      - name: Upload to Steam Workshop item
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        run: |
          set -euo pipefail
          steamcmd +login "$STEAM_USERNAME" +workshop_build_item "$RUNNER_TEMP/workshop_item.vdf" +quit
